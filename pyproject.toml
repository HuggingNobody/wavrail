[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wavrail"
version = "0.1.1"
description = "A streaming-friendly speech recognition toolkit for Python."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
keywords = ["speech-recognition", "streaming", "ctc", "asr", "wav"]
authors = [
    {name = "Zheng Han", email = "236322002+StarWorkshop@users.noreply.github.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
torch = [
    "torch>=2.1",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.6",
    "mypy>=1.10",
    "build>=1.2",
    "twine>=5.0",
    "hatchling>=1.25",
]

[project.urls]
Homepage = "https://github.com/StarWorkshop/wavrail"
Repository = "https://github.com/StarWorkshop/wavrail"
Issues = "https://github.com/StarWorkshop/wavrail/issues"

[project.scripts]
wavrail = "wavrail.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wavrail"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "model: marks tests that require the optional torch extra",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pkg_resources",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "examples", "scripts"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "PLR0913",
    "RUF",
]
ignore = [
    "PLR0913",
]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true